<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm Tư tưởng Hồ Chí Minh - Phần 5</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            max-width: 800px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #d32f2f;
            margin-bottom: 25px;
            font-size: 24px;
            text-transform: uppercase;
            border-bottom: 2px solid #d32f2f;
            padding-bottom: 10px;
        }

        .question-block {
            margin-bottom: 25px;
            padding: 15px;
            border-radius: 8px;
            background-color: #fafafa;
            border: 1px solid #e0e0e0;
        }

        .question-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
            color: #1f2937;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #fff;
        }

        .option-label:hover {
            background-color: #ffebee;
            border-color: #e57373;
        }

        .option-label input {
            margin-right: 12px;
            accent-color: #d32f2f;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #d32f2f;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #b71c1c;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .correct-opt {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
            font-weight: bold;
        }

        .wrong-opt {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Trắc nghiệm Tư tưởng Hồ Chí Minh - Video 5</h1>
    <form id="quizForm">
        <div id="quizContainer"></div>
        <button type="button" class="btn-submit" onclick="submitQuiz()">Nộp bài</button>
    </form>
    <div id="result"></div>
</div>

<script>
    const quizData = [
        {
            q: "Câu 1: Theo Hồ Chí Minh, ưu điểm lớn nhất của tôn giáo Giêsu là gì?",
            options: [
                "A. Đức hy sinh",
                "B. Lòng cao thượng",
                "C. Lòng nhân ái cao cả",
                "D. Sự đấu tranh"
            ],
            answer: "C"
        },
        {
            q: "Câu 2: Theo Hồ Chí Minh, ưu điểm lớn nhất của chủ nghĩa Tam Dân của Tôn Trung Sơn là gì?",
            options: [
                "A. Chống chế độ phong kiến",
                "B. Chống chế độ tư bản chủ nghĩa",
                "C. Đấu tranh vì dân chủ",
                "D. Phù hợp với điều kiện thực tế nước ta"
            ],
            answer: "D"
        },
        {
            q: "Câu 3: Theo Hồ Chí Minh, ưu điểm lớn nhất của chủ nghĩa Mác – Lênin là gì?",
            options: [
                "A. Bản chất khoa học",
                "B. Chủ nghĩa nhân văn",
                "C. Phương pháp làm việc biện chứng",
                "D. Ý tưởng tốt đẹp"
            ],
            answer: "C"
        },
        {
            q: "Câu 4: Theo Hồ Chí Minh, học chủ nghĩa Mác – Lênin để làm gì?",
            options: [
                "A. Để vận dụng vào mọi hoàn cảnh đều đúng",
                "B. Để sống có tình có nghĩa",
                "C. Để chứng tỏ trình độ lý luận",
                "D. Để làm quan"
            ],
            answer: "B"
        },
        {
            q: "Câu 5: Tháng 7 năm 1920, Nguyễn Ái Quốc đã đọc:",
            options: [
                "A. Tác phẩm “Làm gì?”",
                "B. “Sáng kiến vĩ đại”",
                "C. Sơ thảo lần thứ nhất Luận cương về các vấn đề dân tộc",
                "D. Sơ thảo lần thứ nhất Luận cương về các vấn đề dân tộc và vấn đề thuộc địa"
            ],
            answer: "D"
        },
        {
            q: "Câu 6: UNESCO đã ra nghị quyết công nhận Chủ tịch Hồ Chí Minh là “Anh hùng giải phóng dân tộc và Nhà văn hóa kiệt xuất của Việt Nam” vào năm nào?",
            options: [
                "A. 1969",
                "B. 1987",
                "C. 1990",
                "D. 2000"
            ],
            answer: "B"
        },
        {
            q: "Câu 7: Hồ Chí Minh đã đề cập đến đạo đức trong những quan hệ nào của con người?",
            options: [
                "A. Đối với mình",
                "B. Đối với việc",
                "C. Đối với người",
                "D. Cả A, B, C đều đúng"
            ],
            answer: "D"
        },
        {
            q: "Câu 8: Chọn cụm từ đúng nhất để điền vào chỗ trống: Theo tư tưởng Hồ Chí Minh, “Người cách mạng phải có … thì mới gánh được nặng và đi được xa.”",
            options: [
                "A. Trí tuệ",
                "B. Đạo đức cách mạng",
                "C. Phương pháp cách mạng",
                "D. Lập trường tư tưởng cách mạng"
            ],
            answer: "B"
        },
        {
            q: "Câu 9: Theo tư tưởng Hồ Chí Minh, mục tiêu của chủ nghĩa xã hội là gì?",
            options: [
                "A. Nền kinh tế nông nghiệp hiện đại",
                "B. Phát triển mạnh mẽ khoa học kỹ thuật",
                "C. Mở rộng dân chủ cho mọi giai cấp, tầng lớp",
                "D. Không ngừng cải thiện và nâng cao đời sống của nhân dân lao động"
            ],
            answer: "D"
        },
        {
            q: "Câu 10: Chọn cụm từ đúng nhất với tư tưởng Hồ Chí Minh:",
            options: [
                "A. Đại đoàn kết dân tộc là vấn đề sách lược",
                "B. Đại đoàn kết dân tộc là vấn đề chiến lược",
                "C. Đại đoàn kết dân tộc là một thủ đoạn chính trị",
                "D. Đại đoàn kết dân tộc là nghệ thuật"
            ],
            answer: "B"
        }
    ];

    function renderQuiz() {
        const container = document.getElementById('quizContainer');
        let html = '';

        quizData.forEach((item, index) => {
            html += `
                <div class="question-block" id="q-block-${index}">
                    <div class="question-title">${item.q}</div>
                    <div class="options">
            `;
            item.options.forEach(opt => {
                const optVal = opt.charAt(0);
                html += `
                    <label class="option-label" id="label-${index}-${optVal}">
                        <input type="radio" name="question-${index}" value="${optVal}">
                        ${opt}
                    </label>
                `;
            });
            html += `
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function submitQuiz() {
        let score = 0;

        quizData.forEach((item, index) => {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const correctAnswer = item.answer;

            item.options.forEach(opt => {
                const optVal = opt.charAt(0);
                const label = document.getElementById(`label-${index}-${optVal}`);
                label.classList.remove('correct-opt', 'wrong-opt');
            });

            const correctLabel = document.getElementById(`label-${index}-${correctAnswer}`);
            if (correctLabel) {
                correctLabel.classList.add('correct-opt');
            }

            if (selected) {
                if (selected.value === correctAnswer) {
                    score++;
                } else {
                    const wrongLabel = document.getElementById(`label-${index}-${selected.value}`);
                    if (wrongLabel) wrongLabel.classList.add('wrong-opt');
                }
            }
        });

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        
        let percentage = (score / quizData.length) * 100;
        if (percentage >= 80) {
            resultDiv.style.backgroundColor = '#d4edda';
            resultDiv.style.color = '#155724';
            resultDiv.innerHTML = `Kết quả: ${score}/${quizData.length} câu (${percentage}%) - Xuất sắc!`;
        } else {
            resultDiv.style.backgroundColor = '#fff3cd';
            resultDiv.style.color = '#856404';
            resultDiv.innerHTML = `Kết quả: ${score}/${quizData.length} câu (${percentage}%) - Cần cố gắng thêm!`;
        }

        resultDiv.scrollIntoView({ behavior: 'smooth' });
    }

    renderQuiz();
</script>

</body>
</html>
