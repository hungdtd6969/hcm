<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm Tư tưởng Hồ Chí Minh - Phần 3</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            max-width: 800px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #d32f2f;
            margin-bottom: 25px;
            font-size: 24px;
            text-transform: uppercase;
            border-bottom: 2px solid #d32f2f;
            padding-bottom: 10px;
        }

        .question-block {
            margin-bottom: 25px;
            padding: 15px;
            border-radius: 8px;
            background-color: #fafafa;
            border: 1px solid #e0e0e0;
        }

        .question-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
            color: #1f2937;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #fff;
        }

        .option-label:hover {
            background-color: #ffebee;
            border-color: #e57373;
        }

        .option-label input {
            margin-right: 12px;
            accent-color: #d32f2f;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #d32f2f;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #b71c1c;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .correct-opt {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
            font-weight: bold;
        }

        .wrong-opt {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Trắc nghiệm Tư tưởng Hồ Chí Minh - Video 3</h1>
    <form id="quizForm">
        <div id="quizContainer"></div>
        <button type="button" class="btn-submit" onclick="submitQuiz()">Nộp bài</button>
    </form>
    <div id="result"></div>
</div>

<script>
    const quizData = [
        {
            q: "Câu 1: Theo tư tưởng Hồ Chí Minh, muốn xây dựng chủ nghĩa xã hội trước hết cần có:",
            options: [
                "A. Khoa học kỹ thuật",
                "B. Kinh tế phát triển",
                "C. Con người toàn diện",
                "D. Con người xã hội chủ nghĩa"
            ],
            answer: "D"
        },
        {
            q: "Câu 2: Theo tư tưởng Hồ Chí Minh, yếu tố nào là gốc của người cách mạng?",
            options: [
                "A. Tài năng",
                "B. Văn hóa",
                "C. Đạo đức",
                "D. Kỹ năng"
            ],
            answer: "C"
        },
        {
            q: "Câu 3: Theo tư tưởng Hồ Chí Minh, độc lập tự do là:",
            options: [
                "A. Quyền thiêng liêng của tất cả các dân tộc",
                "B. Quyền bất khả xâm phạm của tất cả các dân tộc",
                "C. Quyền thiêng liêng và bất khả xâm phạm của tất cả các dân tộc",
                "D. Quyền bất khả xâm phạm của công dân"
            ],
            answer: "C"
        },
        {
            q: "Câu 4: Theo Hồ Chí Minh, ở đời và làm người thì phải làm gì?",
            options: [
                "A. Yêu nước",
                "B. Yêu thương nhân loại bị áp bức",
                "C. Thương dân",
                "D. Cả A, B, C"
            ],
            answer: "D"
        },
        {
            q: "Câu 5: Đặc trưng cốt lõi nhất của tư tưởng đạo đức Hồ Chí Minh là gì?",
            options: [
                "A. Lòng thương người",
                "B. Chủ nghĩa nhân đạo chiến đấu",
                "C. Sự quan tâm đến con người",
                "D. Cả A, B, C"
            ],
            answer: "D"
        },
        {
            q: "Câu 6: Nội dung cốt lõi của tư tưởng Hồ Chí Minh là gì?",
            options: [
                "A. Độc lập dân tộc",
                "B. Chủ nghĩa xã hội",
                "C. Độc lập dân tộc gắn liền với chủ nghĩa xã hội",
                "D. Dân chủ, dân quyền"
            ],
            answer: "C"
        },
        {
            q: "Câu 7: Theo tư tưởng Hồ Chí Minh, chế độ chính trị mà chúng ta xây dựng là chế độ do:",
            options: [
                "A. Giai cấp công nhân làm chủ",
                "B. Giai cấp nông dân làm chủ",
                "C. Nhân dân làm chủ",
                "D. Trí thức làm chủ"
            ],
            answer: "C"
        },
        {
            q: "Câu 8: Theo tư tưởng Hồ Chí Minh, nền kinh tế mà chúng ta xây dựng phải được tạo lập trên cơ sở:",
            options: [
                "A. Nền công nghiệp hiện đại",
                "B. Nền nông nghiệp hiện đại",
                "C. Chế độ công hữu về tư liệu sản xuất",
                "D. Chế độ tư hữu về tư liệu sản xuất"
            ],
            answer: "C"
        },
        {
            q: "Câu 9: Chọn cụm từ đúng để điền vào chỗ trống: Theo tư tưởng Hồ Chí Minh, “Văn hóa … cho quốc dân đi.”",
            options: [
                "A. Chỉ đường",
                "B. Dẫn đường",
                "C. Soi đường",
                "D. Mở lối"
            ],
            answer: "C"
        },
        {
            q: "Câu 10: Theo tư tưởng Hồ Chí Minh, đại đoàn kết dân tộc là:",
            options: [
                "A. Vấn đề cơ bản có ý nghĩa chiến lược, quyết định thành công của cách mạng",
                "B. Vấn đề cơ bản có ý nghĩa sách lược",
                "C. Vấn đề quyết định thành công của cách mạng",
                "D. Vấn đề trước mắt"
            ],
            answer: "A"
        }
    ];

    function renderQuiz() {
        const container = document.getElementById('quizContainer');
        let html = '';

        quizData.forEach((item, index) => {
            html += `
                <div class="question-block" id="q-block-${index}">
                    <div class="question-title">${item.q}</div>
                    <div class="options">
            `;
            item.options.forEach(opt => {
                const optVal = opt.charAt(0);
                html += `
                    <label class="option-label" id="label-${index}-${optVal}">
                        <input type="radio" name="question-${index}" value="${optVal}">
                        ${opt}
                    </label>
                `;
            });
            html += `
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function submitQuiz() {
        let score = 0;

        quizData.forEach((item, index) => {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const correctAnswer = item.answer;

            item.options.forEach(opt => {
                const optVal = opt.charAt(0);
                const label = document.getElementById(`label-${index}-${optVal}`);
                label.classList.remove('correct-opt', 'wrong-opt');
            });

            const correctLabel = document.getElementById(`label-${index}-${correctAnswer}`);
            if (correctLabel) {
                correctLabel.classList.add('correct-opt');
            }

            if (selected) {
                if (selected.value === correctAnswer) {
                    score++;
                } else {
                    const wrongLabel = document.getElementById(`label-${index}-${selected.value}`);
                    if (wrongLabel) wrongLabel.classList.add('wrong-opt');
                }
            }
        });

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        
        let percentage = (score / quizData.length) * 100;
        if (percentage >= 80) {
            resultDiv.style.backgroundColor = '#d4edda';
            resultDiv.style.color = '#155724';
            resultDiv.innerHTML = `Kết quả: ${score}/${quizData.length} câu (${percentage}%) - Xuất sắc!`;
        } else {
            resultDiv.style.backgroundColor = '#fff3cd';
            resultDiv.style.color = '#856404';
            resultDiv.innerHTML = `Kết quả: ${score}/${quizData.length} câu (${percentage}%) - Cần cố gắng thêm!`;
        }

        resultDiv.scrollIntoView({ behavior: 'smooth' });
    }

    renderQuiz();
</script>

</body>
</html>
