<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm Tư tưởng Hồ Chí Minh - Phần 6</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            max-width: 800px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #d32f2f;
            margin-bottom: 25px;
            font-size: 24px;
            text-transform: uppercase;
            border-bottom: 2px solid #d32f2f;
            padding-bottom: 10px;
        }

        .question-block {
            margin-bottom: 25px;
            padding: 15px;
            border-radius: 8px;
            background-color: #fafafa;
            border: 1px solid #e0e0e0;
        }

        .question-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
            color: #1f2937;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #fff;
        }

        .option-label:hover {
            background-color: #ffebee;
            border-color: #e57373;
        }

        .option-label input {
            margin-right: 12px;
            accent-color: #d32f2f;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #d32f2f;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #b71c1c;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .correct-opt {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
            font-weight: bold;
        }

        .wrong-opt {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Trắc nghiệm Tư tưởng Hồ Chí Minh - Video 6</h1>
    <form id="quizForm">
        <div id="quizContainer"></div>
        <button type="button" class="btn-submit" onclick="submitQuiz()">Nộp bài</button>
    </form>
    <div id="result"></div>
</div>

<script>
    const quizData = [
        {
            q: "CÂU 1: Điền vào chỗ trống để hoàn thành quan điểm của Hồ Chí Minh: “Người cán bộ cách mạng phải có … Mọi việc thành công hay thất bại chủ chốt là do cán bộ có thấm nhuần … hay không.”",
            options: [
                "A. Đạo đức cách mạng",
                "B. Đạo đức",
                "C. Phẩm chất chính trị",
                "D. Bản lĩnh chính trị"
            ],
            answer: ["A"],
            type: "single"
        },
        {
            q: "CÂU 2: Những chuẩn mực đạo đức cách mạng mà Hồ Chí Minh chỉ ra gồm có: (Chọn các chuẩn mực cơ bản)",
            options: [
                "A. Trung với nước, hiếu với dân",
                "B. Cần, kiệm, liêm, chính, chí công vô tư",
                "C. Yêu thương con người, sống có tình, có nghĩa",
                "D. Tinh thần quốc tế trong sáng"
            ],
            answer: ["A", "B", "C", "D"],
            type: "multiple"
        },
        {
            q: "CÂU 3: Điền từ vào chỗ trống để hoàn thành quan điểm của Hồ Chí Minh: “... là trong sạch, không tham lam, không tham địa vị, không tham tiền tài, không tham sung sướng, không ham người tâng bốc mình.”",
            options: [
                "A. Cần",
                "B. Chí công",
                "C. Liêm",
                "D. Chính"
            ],
            answer: ["C"],
            type: "single"
        },
        {
            q: "CÂU 4: Trong những chuẩn mực sau, đâu là một chuẩn mực đạo đức cách mạng mà Hồ Chí Minh đã chỉ ra?",
            options: [
                "A. Trung với nước, hiếu với dân",
                "B. Yêu Tổ quốc",
                "C. Đoàn kết",
                "D. Nhân nghĩa"
            ],
            answer: ["A"],
            type: "single"
        },
        {
            q: "CÂU 5: Điền từ vào chỗ trống để hoàn thành quan điểm của Hồ Chí Minh: “... là siêng năng, chăm chỉ, cố gắng, dẻo dai, phải có kế hoạch cho mọi công việc.”",
            options: [
                "A. Cần",
                "B. Chí công vô tư",
                "C. Liêm",
                "D. Chính"
            ],
            answer: ["A"],
            type: "single"
        },
        {
            q: "CÂU 6: Những chuẩn mực sau, đâu là chuẩn mực đạo đức cách mạng mà Hồ Chí Minh đã chỉ ra?",
            options: [
                "A. Nhân nghĩa",
                "B. Cần, kiệm, liêm, chính, chí công vô tư",
                "C. Đoàn kết",
                "D. Tự do"
            ],
            answer: ["B"],
            type: "single"
        },
        {
            q: "CÂU 7: Điền từ vào chỗ trống để hoàn thành quan điểm của Hồ Chí Minh: “Theo Hồ Chí Minh, các dân tộc phương Đông đều giàu tình cảm và đối với họ … còn có giá trị hơn 100 bài diễn văn tuyên truyền.”",
            options: [
                "A. Một tấm gương sống",
                "B. Một con người",
                "C. Tiền bạc",
                "D. Lợi ích kinh tế"
            ],
            answer: ["A"],
            type: "single"
        },
        {
            q: "CÂU 8: Những nguyên tắc xây dựng đạo đức cách mạng mà Hồ Chí Minh đã chỉ ra gồm:",
            options: [
                "A. Nói đi đôi với làm, nêu gương về đạo đức",
                "B. Xây đi đôi với chống",
                "C. Tu dưỡng đạo đức suốt đời",
                "D. Cả A, B, C đều đúng"
            ],
            answer: ["D"],
            type: "single"
        },
        {
            q: "CÂU 9: Điền từ vào chỗ trống để hoàn thành quan điểm của Hồ Chí Minh: “... không phải trên trời sa xuống, nó do đấu tranh rèn luyện bền bỉ hàng ngày mà phát triển và củng cố. Cũng như ngọc càng mài càng sáng, vàng càng luyện càng trong.”",
            options: [
                "A. Nhân cách",
                "B. Năng lực",
                "C. Đạo đức cách mạng",
                "D. Đạo đức"
            ],
            answer: ["C"],
            type: "single"
        },
        {
            q: "CÂU 10: Những nguyên tắc xây dựng đạo đức cách mạng mà Hồ Chí Minh đã chỉ ra gồm:",
            options: [
                "A. Nói đi đôi với làm, nêu gương về đạo đức",
                "B. Xây đi đôi với chống",
                "C. Tu dưỡng đạo đức suốt đời",
                "D. Cả A, B, C đều đúng"
            ],
            answer: ["D"],
            type: "single"
        },
        {
            q: "CÂU 11: Điền từ vào chỗ trống để hoàn thành quan điểm của Hồ Chí Minh: “Muôn việc thành công hoặc thất bại đều do … tốt hoặc kém.”",
            options: [
                "A. Đạo đức",
                "B. Cán bộ",
                "C. Nhân dân",
                "D. Nhà nước"
            ],
            answer: ["B"],
            type: "single"
        },
        {
            q: "CÂU 12: Theo Hồ Chí Minh, bản chất giai cấp công nhân của Nhà nước thể hiện ở nguyên tắc tổ chức và hoạt động của Nhà nước là nguyên tắc:",
            options: [
                "A. Dân chủ",
                "B. Cộng hòa",
                "C. Tập thể lãnh đạo",
                "D. Tập trung dân chủ"
            ],
            answer: ["D"],
            type: "single"
        },
        {
            q: "CÂU 13: Theo Hồ Chí Minh, những loại “giặc nội xâm”, “giặc ở trong lòng”, thứ giặc nguy hiểm hơn giặc ngoại xâm là gì?",
            options: [
                "A. Tham ô",
                "B. Lãng phí",
                "C. Quan liêu",
                "D. Cả A, B, C"
            ],
            answer: ["D"],
            type: "single"
        },
        {
            q: "CÂU 14: Theo Hồ Chí Minh, những căn bệnh gây mất đoàn kết, gây rối cho công tác là gì?",
            options: [
                "A. Tư túng",
                "B. Chia rẽ",
                "C. Kiêu ngạo",
                "D. Cả A, B, C"
            ],
            answer: ["D"],
            type: "single"
        }
    ];

    function renderQuiz() {
        const container = document.getElementById('quizContainer');
        let html = '';

        quizData.forEach((item, index) => {
            const inputType = item.type === 'multiple' ? 'checkbox' : 'radio';
            html += `
                <div class="question-block" id="q-block-${index}">
                    <div class="question-title">${item.q}</div>
                    <div class="options">
            `;
            item.options.forEach(opt => {
                const optVal = opt.charAt(0);
                html += `
                    <label class="option-label" id="label-${index}-${optVal}">
                        <input type="${inputType}" name="question-${index}" value="${optVal}">
                        ${opt}
                    </label>
                `;
            });
            html += `
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function submitQuiz() {
        let score = 0;

        quizData.forEach((item, index) => {
            const selectedInputs = document.querySelectorAll(`input[name="question-${index}"]:checked`);
            const userAnswers = Array.from(selectedInputs).map(i => i.value);
            const correctAnswers = item.answer;

            // Reset style cũ
            item.options.forEach(opt => {
                const optVal = opt.charAt(0);
                const label = document.getElementById(`label-${index}-${optVal}`);
                label.classList.remove('correct-opt', 'wrong-opt');
            });

            // Highlight đáp án đúng
            correctAnswers.forEach(ans => {
                const correctLabel = document.getElementById(`label-${index}-${ans}`);
                if (correctLabel) correctLabel.classList.add('correct-opt');
            });

            // Đánh dấu sai nếu người dùng chọn nhầm
            userAnswers.forEach(ans => {
                if (!correctAnswers.includes(ans)) {
                    const wrongLabel = document.getElementById(`label-${index}-${ans}`);
                    if (wrongLabel) wrongLabel.classList.add('wrong-opt');
                }
            });

            // So sánh mảng câu trả lời
            const isCorrect = userAnswers.length === correctAnswers.length && 
                              userAnswers.every(val => correctAnswers.includes(val));

            if (isCorrect) {
                score++;
            }
        });

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        
        let percentage = Math.round((score / quizData.length) * 100);
        if (percentage >= 80) {
            resultDiv.style.backgroundColor = '#d4edda';
            resultDiv.style.color = '#155724';
            resultDiv.innerHTML = `Kết quả: ${score}/${quizData.length} câu (${percentage}%) - Xuất sắc!`;
        } else {
            resultDiv.style.backgroundColor = '#fff3cd';
            resultDiv.style.color = '#856404';
            resultDiv.innerHTML = `Kết quả: ${score}/${quizData.length} câu (${percentage}%) - Cần cố gắng thêm!`;
        }

        resultDiv.scrollIntoView({ behavior: 'smooth' });
    }

    renderQuiz();
</script>

</body>
</html>
